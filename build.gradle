plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${mdg_version}"
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

// Gametests run through runGameTestServer, not the JUnit test task
tasks.named('test') { enabled = false }

// Compat modules whose upstream mod has no 26.1 build yet are excluded from compilation.
// Flip the matching animus_compat_* property in gradle.properties once the dependency ports.
def compatSources = [
        arsnouveau : ['animus_compat_arsnouveau', [
                'com/breakinblocks/animusnv/compat/arsnouveau/**',
                'com/breakinblocks/animusnv/compat/ArsNouveauCompat.java',
                'com/breakinblocks/animusnv/compat/ArsNouveauCompatLoader.java',
        ]],
        ironsspells: ['animus_compat_ironsspells', [
                'com/breakinblocks/animusnv/compat/ironsspells/**',
                'com/breakinblocks/animusnv/compat/IronsSpellsCompat.java',
                'com/breakinblocks/animusnv/compat/IronsSpellsCompatLoader.java',
                'com/breakinblocks/animusnv/mixin/AbstractSpellMixin.java',
                'com/breakinblocks/animusnv/mixin/IronsSpellsMixinPlugin.java',
        ]],
        malum      : ['animus_compat_malum', [
                'com/breakinblocks/animusnv/compat/malum/**',
                'com/breakinblocks/animusnv/compat/MalumCompat.java',
                'com/breakinblocks/animusnv/compat/MalumCompatLoader.java',
        ]],
        evilcraft  : ['animus_compat_evilcraft', [
                'com/breakinblocks/animusnv/compat/evilcraft/**',
                'com/breakinblocks/animusnv/compat/EvilCraftCompat.java',
                'com/breakinblocks/animusnv/compat/EvilCraftCompatLoader.java',
        ]],
]

def disabledCompat = compatSources.findAll { _, spec -> !project.findProperty(spec[0]).toBoolean() }

if (!disabledCompat.isEmpty()) {
    logger.lifecycle("Animus: compat disabled for 26.1 (no upstream build): ${disabledCompat.keySet().join(', ')}")
    sourceSets.main.java {
        disabledCompat.each { _, spec -> spec[1].each { exclude it } }
    }
}

// Data files that reference registry entries only present when a disabled compat module
// compiles. Shipping them would fail datapack load, so they are kept in source but not packaged.
def ironsSpellsData = [
        'data/animusnv/neovitae/sigil_type/crimson_will.json',
        'data/animusnv/recipe/array/sigil_crimson_will.json',
        'data/animusnv/recipe/ara_vitae/blood_infused_spellbook_*.json',
        'data/animusnv/advancement/arcane_blood.json',
        'data/animusnv/advancement/sanguine_scroll.json',
        'data/curios/tags/item/spellbook.json',
        'data/animusnv/modonomicon/books/guide/entries/compatibility/blood_infused_spellbook.json',
        'data/animusnv/modonomicon/books/guide/entries/compatibility/blood_infused_spellbook/**',
        'data/animusnv/modonomicon/books/guide/entries/compatibility/sanguine_scrolls.json',
        'data/animusnv/modonomicon/books/guide/entries/compatibility/sanguine_scrolls/**',
        'data/animusnv/modonomicon/books/guide/entries/sigils/sigil_crimson_will*.json',
        'data/animusnv/modonomicon/books/guide/entries/sigils/sigil_crimson_will/**',
        'data/animusnv/modonomicon/books/guide/entries/sigils/sigil_crimson_will_compat/**',
]

if (!project.findProperty('animus_compat_ironsspells').toBoolean()) {
    tasks.named('processResources', ProcessResources).configure {
        ironsSpellsData.each { exclude it }
    }
}

repositories {
    maven { name = "Progwml6"; url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com" }
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
    maven { name = "Thehippomaster"; url = "https://maven.theillusivec4.top/" }
    maven { name = "GeckoLib"; url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { name = "KosmX"; url = "https://maven.kosmx.dev/" }
    maven { name = "BreakInBlocks"; url = "https://maven.breakinblocks.com/releases" }
    maven { name = "BreakInBlocksSnapshots"; url = "https://maven.breakinblocks.com/snapshots" }
    maven {
        name = "KliKli"
        url = "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
        content { includeGroup "com.klikli_dev" }
    }
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "FTB Maven"
        url = "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    maven {
        name = "Architectury Maven"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
}

dependencies {
    implementation "com.breakinblocks.neovitae:neovitae:${neovitae_version}"

    compileOnly("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}") { transitive = false }
    runtimeOnly("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}") { transitive = false }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"

    compileOnly "curse.maven:geckolib-388172:${geckolib_cursemaven_id}"
    runtimeOnly "curse.maven:geckolib-388172:${geckolib_cursemaven_id}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // FTB Teams - soft dependency for team binding support (not required at runtime)
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }

    compileOnly "maven.modrinth:cyclops-core:${cyclopscore_version}"
    runtimeOnly "maven.modrinth:cyclops-core:${cyclopscore_version}"

    compileOnly "maven.modrinth:evilcraft:${evilcraft_version}"
    runtimeOnly "maven.modrinth:evilcraft:${evilcraft_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = version.toString().endsWith("-SNAPSHOT") ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    type = version.toString().endsWith("-SNAPSHOT") ? BETA : STABLE
    modLoaders.add("neoforge")

    curseforge {
        projectId = curseforge_project_id
        projectSlug = curseforge_project_slug
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        requires("neovitae", "geckolib", "modonomicon")
        optional("jei", "curios", "evilcraft")
    }

    modrinth {
        projectId = modrinth_project_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("neovitae", "geckolib", "modonomicon")
        optional("jei", "curios", "evilcraft")
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

tasks.register('publishMod') {
    description = 'Publishes the mod to CurseForge, Modrinth, and the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMods', 'publishMaven'
}

tasks.named('publishMods') {
    finalizedBy 'publishMaven'
}

tasks.named('publishCurseforge') {
    doFirst {
        if (!curseforge_project_id) {
            throw new GradleException("Set curseforge_project_id in gradle.properties before publishing.")
        }
    }
}

tasks.named('publishModrinth') {
    doFirst {
        if (!modrinth_project_id) {
            throw new GradleException("Set modrinth_project_id in gradle.properties before publishing.")
        }
    }
}

tasks.named('publishModrinth') {
    doFirst {
        if (!modrinth_project_id) {
            throw new GradleException("Set modrinth_project_id in gradle.properties before publishing.")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
