plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        // JEI
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // Curios
        name = "Thehippomaster"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Patchouli
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        // CurseForge Maven (for optional compat mods)
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Modrinth Maven (for optional compat mods)
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Geckolib
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        // PlayerAnimator
        name = "KosmX"
        url = "https://maven.kosmx.dev/"
    }
    mavenLocal()
}

dependencies {
    // Blood Magic - local build from mavenLocal or file dependency
    // Option 1: Use local maven (run ./gradlew publishToMavenLocal in BloodMagic first)
    // implementation "wayoftime:bloodmagic:${bloodmagic_version}"

    // Option 2: Use file dependency (place BloodMagic jar in libs folder)
    implementation files('libs/bloodmagicnv-3.4.0-3-beta.jar')

    // JEI - using CurseMaven NeoForge version (not Forge!)
    compileOnly "curse.maven:jei-238222:${jei_cursemaven_id}"
    runtimeOnly "curse.maven:jei-238222:${jei_cursemaven_id}"

    // Curios - for bauble integration
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Patchouli - for documentation books
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // ============================================================================
    // Library Dependencies (required by compat mods)
    // ============================================================================

    // GeckoLib - required by Ars Nouveau, Iron's Spells
    compileOnly "curse.maven:geckolib-388172:${geckolib_cursemaven_id}"
    runtimeOnly "curse.maven:geckolib-388172:${geckolib_cursemaven_id}"

    // PlayerAnimator - required by Iron's Spells
    // Downloaded from Modrinth (2.0.1+1.21.1 required by Iron's Spells)
    compileOnly files('libs/player-animation-lib-2.0.1+1.21.1.jar')
    runtimeOnly files('libs/player-animation-lib-2.0.1+1.21.1.jar')

    // Lodestone - required by Malum
    compileOnly "curse.maven:lodestone-616457:${lodestone_cursemaven_id}"
    runtimeOnly "curse.maven:lodestone-616457:${lodestone_cursemaven_id}"

    // Modopedia - required by Blood Magic for in-game documentation
    // Downloaded from Modrinth since Maven resolution was problematic
    compileOnly files('libs/modopedia-1.1.5-neoforge.jar')
    runtimeOnly files('libs/modopedia-1.1.5-neoforge.jar')

    // ============================================================================
    // Optional Compat Dependencies
    // ============================================================================
    // These dependencies are runtimeOnly, meaning they're available in dev/datagen
    // but NOT packaged in the production jar. Production users must install the
    // compat mods themselves. Runtime detection via ModList.get().isLoaded() handles
    // graceful degradation when mods are missing.
    // ============================================================================

    // Ars Nouveau
    compileOnly "curse.maven:ars-nouveau-401955:${arsnouveau_cursemaven_id}"
    runtimeOnly "curse.maven:ars-nouveau-401955:${arsnouveau_cursemaven_id}"

    // Iron's Spells n Spellbooks
    compileOnly "curse.maven:irons-spells-n-spellbooks-855414:${ironsspells_cursemaven_id}"
    runtimeOnly "curse.maven:irons-spells-n-spellbooks-855414:${ironsspells_cursemaven_id}"

    // Malum
    compileOnly "curse.maven:malum-484064:${malum_cursemaven_id}"
    runtimeOnly "curse.maven:malum-484064:${malum_cursemaven_id}"

    // Note: Botania not yet ported to 1.21.1 - compat remains disabled
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
