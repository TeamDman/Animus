## Dependency Properties
# Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,27)
neoforge_version=26.1.2.73
neoforge_version_range=[26.1.2.22-beta,)
loader_version_range=[11,)
# ModDevGradle 2.0.141+ is the first release that understands 26.1's MC version format.
mdg_version=2.0.141

## Dependencies
# Neo Vitae - release from BreakInBlocks maven (https://maven.breakinblocks.com/releases)
neovitae_version=26.1.2-1.1.7

# JEI - resolved from BlameJared maven as jei-<mc>-neoforge[-api]
jei_version=29.5.0.26

# Curios
curios_version=15.0.0

## Library Dependencies (required by compat mods)
# GeckoLib - 5.x is the 26.1-compatible line
geckolib_cursemaven_id=7913641

# Modonomicon - 26.1.2-neoforge release (KliKli maven)
modonomicon_version=2.0.0

# Jade - for in-game block/entity information (Modrinth; version string is loader-specific)
jade_version=26.1.8+neoforge

# FTB Teams + FTB Library (team binding compat) - from FTB maven
ftb_teams_version=26.1.2.4
ftb_library_version=26.1.2.6

# EvilCraft + CyclopsCore (blood unification compat) - 26.1.2 releases via Modrinth maven
# CyclopsCore is pinned by Modrinth version id: its version number is shared across the
# neoforge/forge/fabric variants and the maven otherwise resolves the Forge jar.
evilcraft_version=26.1.2-1.2.101
cyclopscore_version=64uNQU6O

## Compat module toggles
# Ars Nouveau / Iron's Spells / Malum (+Lodestone) have no 26.1 builds yet, so their
# compat sources are excluded from compilation. Flip a toggle once upstream ports.
animus_compat_arsnouveau=false
animus_compat_ironsspells=false
animus_compat_malum=false
animus_compat_evilcraft=true

