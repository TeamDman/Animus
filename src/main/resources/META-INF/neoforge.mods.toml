modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Saereth/Animus/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Animus: NeoVitae"
displayURL = "https://github.com/Saereth/Animus"
logoFile = "logo.png"
credits = "WayOfTime for NeoVitae"
authors = "${mod_authors}"
description = '''${mod_description}'''

# =============================================================================
# Required Dependencies
# =============================================================================

[[dependencies.animusnv]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.animusnv]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.animusnv]]
    modId = "neovitae"
    type = "required"
    versionRange = "[1.1.2,)"
    ordering = "AFTER"
    side = "BOTH"

# =============================================================================
# Optional Dependencies - Core Integrations
# =============================================================================

[[dependencies.animusnv]]
    modId = "jei"
    type = "optional"
    versionRange = "[29.0,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.animusnv]]
    modId = "curios"
    type = "optional"
    versionRange = "[15.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.animusnv]]
    modId = "modonomicon"
    type = "optional"
    versionRange = "[2.0,)"
    ordering = "AFTER"
    side = "BOTH"

# =============================================================================
# Optional Dependencies - Compat Mods
# =============================================================================

[[dependencies.animusnv]]
    modId = "ars_nouveau"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.animusnv]]
    modId = "irons_spellbooks"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.animusnv]]
    modId = "malum"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.animusnv]]
    modId = "evilcraft"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

# =============================================================================
# Mixins
# =============================================================================

[[mixins]]
config = "animusnv.mixins.json"

